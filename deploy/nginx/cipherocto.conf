# CipherOcto on one VPS: Nginx terminates TLS and routes by path.
#
#   https://cipherocto.com/                  -> dashboard (static React build)
#   https://cipherocto.com/api/...           -> API   (127.0.0.1:4000)
#   https://cipherocto.com/<app>/privacy     -> API   (public policy page, served from MongoDB)
#
# Install:
#   sudo cp deploy/nginx/cipherocto.conf /etc/nginx/sites-available/cipherocto.conf
#   sudo ln -s /etc/nginx/sites-available/cipherocto.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d cipherocto.com -d www.cipherocto.com   # fills in the ssl_* lines
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace cipherocto.com with your real domain everywhere in this file.

upstream cipherocto_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cipherocto.com www.cipherocto.com;
    return 301 https://cipherocto.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cipherocto.com;

    # certbot manages these two lines (and adds the options/dhparams includes).
    ssl_certificate     /etc/letsencrypt/live/cipherocto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cipherocto.com/privkey.pem;

    # Policy HTML is capped at ~500 KB by the API; leave headroom for JSON encoding.
    client_max_body_size 1m;

    # What the API needs to see the real client and the original scheme (TRUST_PROXY=true).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://cipherocto_api;
    }

    # ── Public policy pages: /<app>/privacy ──────────────────────────────
    # Only this exact shape reaches the API; the app-name segment is validated again there.
    location ~ ^/[a-z0-9-]+/privacy/?$ {
        proxy_pass http://cipherocto_api;
    }

    # ── Dashboard (static build of cipherocto-web) ───────────────────────
    root /var/www/cipherocto-web;
    index index.html;

    # Hashed build assets can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: any other path is a React Router route.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
